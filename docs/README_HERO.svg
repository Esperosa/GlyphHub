    <rect x="792" y="120" width="336" height="400" rx="36" fill="#111113" stroke="#252528"/>
    <g clip-path="url(#panelClip)">
      <rect x="792" y="120" width="336" height="400" fill="url(#matrixPattern)" mask="url(#matrixMask)"/>
    </g>
    <circle cx="960" cy="320" r="172" stroke="#3C3C41" stroke-width="2"/>
    <circle cx="960" cy="320" r="148" stroke="#26262A" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="960" cy="320" r="102" fill="#FF4A50" fill-opacity="0.12" filter="url(#softBlur)"/>

    <g>
      <circle cx="960" cy="180" r="8" fill="#FFD0D2"/>
      <circle cx="1034" cy="202" r="8" fill="#FFD0D2"/>
      <circle cx="1088" cy="256" r="8" fill="#FFD0D2"/>
      <circle cx="1108" cy="320" r="8" fill="#FFD0D2"/>
      <circle cx="1088" cy="384" r="8" fill="#FFD0D2"/>
      <circle cx="1034" cy="438" r="8" fill="#FFD0D2"/>
      <circle cx="960" cy="460" r="8" fill="#FFD0D2"/>
      <circle cx="886" cy="438" r="8" fill="#FFD0D2"/>
      <circle cx="832" cy="384" r="8" fill="#FFD0D2"/>
      <circle cx="812" cy="320" r="8" fill="#FFD0D2"/>
      <circle cx="832" cy="256" r="8" fill="#FFD0D2"/>
      <circle cx="886" cy="202" r="8" fill="#FFD0D2"/>
      <circle cx="960" cy="320" r="10" fill="#FFFFFF"/>
      <circle cx="960" cy="248" r="8" fill="#FFE4E5"/>
      <circle cx="1008" cy="288" r="8" fill="#FFE4E5"/>
      <circle cx="1008" cy="352" r="8" fill="#FFE4E5"/>
      <circle cx="960" cy="392" r="8" fill="#FFE4E5"/>
      <circle cx="912" cy="352" r="8" fill="#FFE4E5"/>
      <circle cx="912" cy="288" r="8" fill="#FFE4E5"/>
    </g>
  </g>

  <text x="796" y="584" fill="#8F8F95" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Service-first Matrix control • Circular-safe 13x13 visuals • Honest progress</text>
</svg>